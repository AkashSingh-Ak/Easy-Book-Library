<!-- app/templates/library.html -->
{% extends "base.html" %}

{% block title %}Library - Easy Book Library{% endblock %}

{% block content %}
<main class="main-container">
    <!-- Import File Dropzone -->
    <div id="dropzone" class="upload-dropzone">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        <h3>Drag & Drop books here</h3>
        <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">Supports PDF & EPUB formats. Large books index in background.</p>
        <button class="btn btn-primary" style="margin-top: 1rem;" onclick="document.getElementById('file-picker').click()">Browse Files</button>
        <input type="file" id="file-picker" style="display: none;" accept=".pdf,.epub" multiple onchange="handleFileSelect(event)">
    </div>

    <!-- Filters, Search & Sort Panel -->
    <div class="library-controls">
        <div class="search-input-group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-right: 0.5rem;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="library-search" placeholder="Search by title, author..." oninput="fetchBooks()">
        </div>
        
        <div class="filters-group">
            <select id="filter-type" class="filter-select" onchange="fetchBooks()">
                <option value="">All Formats</option>
                <option value="pdf">PDF Books</option>
                <option value="epub">EPUB Books</option>
            </select>
            
            <select id="filter-status" class="filter-select" onchange="fetchBooks()">
                <option value="">All Progress</option>
                <option value="unread">Unread</option>
                <option value="in_progress">In Progress</option>
                <option value="finished">Finished</option>
            </select>
            
            <select id="sort-by" class="filter-select" onchange="fetchBooks()">
                <option value="added_date_desc">Recently Added</option>
                <option value="last_opened_desc">Recently Opened</option>
                <option value="title_asc">Title (A-Z)</option>
                <option value="title_desc">Title (Z-A)</option>
                <option value="author_asc">Author (A-Z)</option>
                <option value="progress_desc">Highest Progress</option>
            </select>

            <div class="view-toggle">
                <button id="view-grid-btn" class="view-btn active" onclick="setViewMode('grid')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                </button>
                <button id="view-list-btn" class="view-btn" onclick="setViewMode('list')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Active Books List Containers -->
    <div id="books-container" class="books-grid">
        <!-- Rendered via JS -->
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
<script>
    // Initialize library loading
    document.addEventListener("DOMContentLoaded", () => {
        setupDragAndDrop();
        fetchBooks();
    });
</script>
{% endblock %}
